aid: flowscope
name: Flowscope
description: >-
  Flowscope is an AI-native process-automation firm (Y Combinator, Spring 2026)
  that deploys agents to observe how a business actually runs, map and redesign
  its workflows, then ship the automation into production on top of existing
  systems in days rather than months. It positions itself as the AI team for
  mid-market operating businesses that do not have one, selling
  services-as-software with outcome-aligned pricing rather than a self-serve
  developer API. Founded in 2025 in San Francisco by Samuel Mirpuri (ex-McKinsey
  QuantumBlack) and Javier Leguina (founding engineer, ModelML), Flowscope runs
  forward-deployed agents that shadow employees, baseline the process, redesign
  the work, and write back into legacy systems of record while a human core
  keeps judgment and accountability in the loop.
